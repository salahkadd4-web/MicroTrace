[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microtrace-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "microtrace-core",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
maskrcnn = ["torch>=2.5", "torchvision>=0.20"]  # optional GPU step (C6 task 9); not installed

[tool.setuptools.packages.find]
where = ["src"]
